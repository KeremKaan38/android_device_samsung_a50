name: Build PBRP for A50

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ROM_DIR: pbrp
      DEVICE_CODENAME: a50

    steps:
    - name: 📥 Gerekli Paketleri Kur
      run: |
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo apt install -y git zip curl repo bc build-essential \
        ccache libncurses5-dev libssl-dev unzip bison flex \
        lib32stdc++6 lib32z1 openjdk-8-jdk python2

    - name: 🛠️ Java 8'i Ayarla
      run: |
        sudo update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java
        sudo update-alternatives --set javac /usr/lib/jvm/java-8-openjdk-amd64/bin/javac

    - name: 📁 Kaynak Dizini Oluştur
      run: mkdir $ROM_DIR

    - name: 📥 PBRP Manifestini İndir
      working-directory: ${{ env.ROM_DIR }}
      run: |
        repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b android-12.1
        repo sync -j$(nproc --all)

    - name: 📁 Cihaz Ağacını Klonla
      working-directory: ${{ env.ROM_DIR }}
      run: |
        git clone https://github.com/PeterKnecht93/android_device_samsung_a50 -b pbrp-12.1 device/samsung/a50

    - name: ⚙️ Ortamı Ayarla ve Derle
      working-directory: ${{ env.ROM_DIR }}
      run: |
        bash -c "source build/envsetup.sh && lunch pb_${{ env.DEVICE_CODENAME }}-eng && mka pbrp -j$(nproc --all)"

    - name: 📦 recovery.img'i Zip'le
      working-directory: ${{ env.ROM_DIR }}
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        if [ -f out/target/product/${{ env.DEVICE_CODENAME }}/recovery.img ]; then
          cp out/target/product/${{ env.DEVICE_CODENAME }}/recovery.img $GITHUB_WORKSPACE/output/
          cd $GITHUB_WORKSPACE/output
          zip recovery_${{ env.DEVICE_CODENAME }}.zip recovery.img
        else
          echo "❌ recovery.img bulunamadı!"
          exit 1
        fi

    - name: 🚀 GitHub Release Oluştur
      uses: softprops/action-gh-release@v1
      with:
        name: PBRP Recovery A50
        tag_name: a50-pbrp-latest
        files: output/recovery_${{ env.DEVICE_CODENAME }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
