name: Build PBRP for A50

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex g++-multilib \
          gcc-multilib git gnupg gperf imagemagick libncurses5-dev libxml2 \
          libssl-dev lzop pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev \
          liblz4-tool

      - name: Setup build environment and build PBRP
        run: |
          . build/envsetup.sh
          lunch pb_a50-eng
          mka pbrp
